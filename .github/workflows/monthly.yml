name: Daily rebalance

# Backup trigger for the daily rebalance of the multi-strategy fund and the learning
# allocator. The afternoon day-trader run normally does it at 15:40 itself (live.py); this
# workflow, started by cron-job.org at 15:40, only does something if that didn't happen.
# (The file keeps its old name because the cron-job.org alarm points at it.)
on:
  workflow_dispatch:

# Shares the day trader's group, so it waits until that run is done: the two can never
# rebalance at the same moment, and by then the rebalance is logged and this one skips it.
concurrency:
  group: daytrader
  cancel-in-progress: false

permissions:
  contents: write  # to commit the trade logs

jobs:
  rebalance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      MODERATE_API_KEY: ${{ secrets.MODERATE_API_KEY }}
      MODERATE_SECRET_KEY: ${{ secrets.MODERATE_SECRET_KEY }}
      SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }}
      SAFE_SECRET_KEY: ${{ secrets.SAFE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data
          key: daily-data-${{ steps.month.outputs.ym }}
          restore-keys: daily-data-
      - run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python live.py daily
