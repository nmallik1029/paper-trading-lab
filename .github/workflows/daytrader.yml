name: Day trader

on:
  schedule:
    # Times are UTC. Each session is listed twice so it starts on time under both EDT and
    # EST; the extra run finds every decision already logged and exits.
    - cron: "25 13 * * 1-5"  # morning: 9:25 EDT / 8:25 EST
    - cron: "25 14 * * 1-5"  # morning: 9:25 EST
    - cron: "5 17 * * 1-5"   # afternoon: 13:05 EDT / 12:05 EST
    - cron: "5 18 * * 1-5"   # afternoon: 13:05 EST
  workflow_dispatch:
    inputs:
      session:
        description: Which half of the day to trade
        type: choice
        options: [morning, afternoon]
        required: true

# One day-trader run at a time, so two runs can never trade the same account at once.
concurrency:
  group: daytrader
  cancel-in-progress: false

permissions:
  contents: write  # to commit the decision logs

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data
          key: daytrader-data-${{ steps.month.outputs.ym }}
          restore-keys: daytrader-data-
      - id: session
        run: |
          case "${{ github.event.schedule }}" in
            "25 13 * * 1-5"|"25 14 * * 1-5") echo "name=morning" >> "$GITHUB_OUTPUT" ;;
            "5 17 * * 1-5"|"5 18 * * 1-5") echo "name=afternoon" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=${{ inputs.session }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python live.py daytrader --session ${{ steps.session.outputs.name }}
      # If the session crashed after the close-out time, make sure nothing is held overnight.
      - if: failure() && steps.session.outputs.name == 'afternoon'
        run: python live.py safety
