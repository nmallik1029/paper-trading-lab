name: Day trader

# Started by cron-job.org (9:20 and 13:05 New York time, weekdays) through the GitHub API.
# GitHub's own schedule isn't used: its runs can fire hours late, and a late run would hold
# up the real one, since only one day-trader run can go at a time.
on:
  workflow_dispatch:
    inputs:
      session:
        description: Which half of the day to trade
        type: choice
        options: [morning, afternoon]
        required: true

# One day-trader run at a time, so two runs can never trade the same account at once.
concurrency:
  group: daytrader
  cancel-in-progress: false

permissions:
  contents: write  # to commit the decision logs

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      MODERATE_API_KEY: ${{ secrets.MODERATE_API_KEY }}
      MODERATE_SECRET_KEY: ${{ secrets.MODERATE_SECRET_KEY }}
      SAFE_API_KEY: ${{ secrets.SAFE_API_KEY }}
      SAFE_SECRET_KEY: ${{ secrets.SAFE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # At the open, the two daily accounts sell the TQQQ their overnight sleeve bought.
      # If this fails, the day trader still runs.
      - if: inputs.session == 'morning'
        continue-on-error: true
        run: python live.py unwind
      - run: python live.py daytrader --session ${{ inputs.session }}
      # If the session crashed after the close-out time, make sure nothing is held overnight.
      - if: failure() && inputs.session == 'afternoon'
        run: python live.py safety
